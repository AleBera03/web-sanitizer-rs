[package]
name = "web-sanitizer-rs"
version = "0.1.0"
edition = "2024"
exclude = ["final_report/"]

[lib]
name = "web_sanitizer"
path = "src/lib.rs"

[[bin]]
name = "wsrs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
lol_html = "2"
idna = "1.1.0"
unicode-security = "0.1"
thiserror = "2"
anyhow = "1.0"
jiff = "0.2.35"
rand = "0.10.2"
lopdf = "0.44.0"
ureq = {version = "3", default-features = false, features = ["rustls"]}
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
base64 = "0.22"
cssparser = "0.37.0"

[dev-dependencies]
tempfile = "3"
