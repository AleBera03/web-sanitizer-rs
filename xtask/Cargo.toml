[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
web_sanitizer = { path = "..", package = "web-sanitizer-rs" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "0.9"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.22"
url = "2"
charming = { version = "0.6", features = ["ssr-raster"] }